<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Core -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horse Coat Color Simulator</title>
    <meta name="description"
        content="Generate random parents and simulate possible offspring. Accurate to real life horse coat color genetics!">
    <link rel="canonical" href="jasminedevv.github.io/horsecolorsim/">

    <!-- Icons & manifest -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐴</text></svg>">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Essentials -->
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>

</head>

<body>


    <main id="main">
        <h1>Horse Coat Color Simulator</h1>
        <div class="parents">
            <div class="mom">
                <div class="horse" id="horse-mom">
                    <img class="horse-base" src="base-coats/bay.png" alt="">
                    <div class="overlays">
                        <img class="tobiano" src="overlays/tobiano.png" alt="">
                        <img class="roan" src="overlays/roan.png" alt="">
                        <img class="dun" src="overlays/dun.png" alt="">
                    </div>
                </div>
                <button type="button" class="reroll" data-target="horse-mom">Reroll mom</button>
            </div>
            <div class="dad">
                <div class="horse" id="horse-dad">
                    <img class="horse-base" src="base-coats/black.png" alt="">
                    <div class="overlays">
                        <img class="tobiano" src="overlays/tobiano.png" alt="">
                        <img class="roan" src="overlays/roan.png" alt="">
                        <img class="dun" src="overlays/dun.png" alt="">
                    </div>
                </div>
                <button type="button" class="reroll" data-target="horse-dad">Reroll dad</button>
            </div>
        </div>
        <hr>
        <div class="foal">
            <div class="horse" id="horse-foal">
                <img class="horse-base" src="base-coats/bay.png" alt="">
                <div class="overlays">
                    <img class="tobiano" src="overlays/tobiano.png" alt="">
                    <img class="roan" src="overlays/roan.png" alt="">
                    <img class="dun" src="overlays/dun.png" alt="">
                </div>
            </div>
            <button id="horse-foal" type="button" class="reroll" data-target="horse-foal">Reroll foal</button>
        </div>

        <footer class="site-footer">
        </footer>

</body>

</html>
